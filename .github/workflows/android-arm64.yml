name: Android ARM64 standalone

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version label, e.g. 1.14.3-test"
        required: true
        default: "1.14.3-test"
        type: string
      ebpf:
        description: "Enable with_ebpf build tag"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build:
    name: Build sing-box for Android ARM64
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: xiaobaf14g-testing

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.8"
          cache: true

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28

      - name: Prepare build tags
        shell: bash
        run: |
          set -euo pipefail
          TAGS="$(cat release/DEFAULT_BUILD_TAGS)"
          if [[ "${{ inputs.ebpf }}" == "true" ]]; then
            TAGS="${TAGS},with_ebpf"
          fi
          echo "BUILD_TAGS=${TAGS}" >> "$GITHUB_ENV"
          echo "VERSION=${{ inputs.version }}" >> "$GITHUB_ENV"

      - name: Install build helper
        run: go install -v ./cmd/internal/build

      - name: Build standalone executable
        shell: bash
        env:
          CGO_ENABLED: "1"
          BUILD_GOOS: android
          BUILD_GOARCH: arm64
          CC: aarch64-linux-android23-clang
          CXX: aarch64-linux-android23-clang++
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dist
          build go build -v -trimpath \
            -o dist/sing-box \
            -tags "${BUILD_TAGS}" \
            -ldflags "-X github.com/sagernet/sing-box/constant.Version=${VERSION} $(cat release/LDFLAGS) -s -w -buildid=" \
            ./cmd/sing-box

      - name: Verify executable
        run: |
          set -euo pipefail
          file dist/sing-box
          go version -m dist/sing-box
          ls -lh dist/sing-box
          chmod +x dist/sing-box

      - name: Package artifact
        run: |
          tar -czf sing-box-android-arm64.tar.gz -C dist sing-box
          sha256sum sing-box-android-arm64.tar.gz \
            > sing-box-android-arm64.tar.gz.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sing-box-android-arm64
          path: |
            sing-box-android-arm64.tar.gz
            sing-box-android-arm64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14
